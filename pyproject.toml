[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcancer"
version = "0.1.0"
description = "AI-assisted CT lung cancer detection, characterisation and risk estimation — academic research prototype"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT (code only; datasets keep their own licences)" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
